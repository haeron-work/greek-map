<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오디세이아의 항해 — 신화 지도</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <span class="eyebrow">historical atlas · v1</span>
      <h1 id="page-title">오디세이아의 항해</h1>
    </div>
    <label class="toggle">
      <span class="toggle-label">고대 지명</span>
      <input type="checkbox" id="name-toggle">
      <span class="toggle-track"><span class="toggle-thumb"></span></span>
      <span class="toggle-label">현대 지명</span>
    </label>
  </header>
  <main>
    <div id="map"></div>
    <aside id="log">
      <div class="log-header">
        <span class="eyebrow">항해 기록</span>
        <h2 id="figure-name">—</h2>
        <p id="source-work"></p>
      </div>
      <ol id="log-list"></ol>
    </aside>
  </main>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="js/app.js"></script>
</body>
</html>
